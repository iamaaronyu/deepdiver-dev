[project]
name = "deepdive-local"
version = "0.4.0"
description = "Local evidence-driven research workspace with bounded orchestration"
requires-python = ">=3.11,<3.14"
dependencies = [
  "openai-agents==0.24.0",
  "fastapi==0.159.1",
  "uvicorn==0.54.0",
  "python-dotenv==1.2.4",
  "httpx==0.28.1",
  "trafilatura==2.3.1",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
